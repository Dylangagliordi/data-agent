[project]
name = "data-agent"
version = "0.1.0"
description = "SQL analyst sub-agent built with LangGraph"
authors = [
    { name = "Dylan Gagliordi", email = "dylangagliordi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[tool.uv]
package = false
